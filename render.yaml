# Render Blueprint for the Car Checkup API (backend). See README → "Despliegue".
services:
  - type: web
    name: car-checkup-api
    runtime: node
    plan: free
    region: oregon
    # Dev dependencies (prisma, tsup, tsx) are needed to build and migrate.
    buildCommand: npm ci --include=dev && npm run db:generate -w backend && npm run build -w backend
    # Free plan has no pre-deploy step: apply migrations and the (idempotent) catalog seed on start.
    startCommand: npm run db:deploy -w backend && npm run db:seed -w backend && npm run start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: UNUSUAL_KM_PER_DAY
        value: "1500"
      # Supabase → Connect: Transaction pooler (port 6543) + "?pgbouncer=true"
      - key: DATABASE_URL
        sync: false
      # Supabase → Connect: Session pooler (port 5432); IPv4, used by migrations
      - key: DIRECT_URL
        sync: false
      # https://<project-ref>.supabase.co
      - key: SUPABASE_URL
        sync: false
      # https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWKS_URL
        sync: false
      # Frontend URL(s), comma separated, e.g. https://car-checkup.vercel.app
      - key: CORS_ORIGIN
        sync: false
      # --- Recordatorios (feature 003) ---
      # URL de la PWA (enlaces de avisos) y de este API (baja en un clic de los correos)
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      # p. ej. "Car Checkup <avisos@tudominio.com>" (dominio verificado en Resend)
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
      # Copia este valor al secreto JOBS_SECRET de GitHub Actions
      - key: JOBS_SECRET
        generateValue: true
      # --- Donaciones (feature 004) ---
      - key: PAYMENTS_PROVIDER_MODE
        value: real
      # Stripe → Developers → API keys / Webhooks (https://<servicio>.onrender.com/webhooks/stripe)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # developer.paypal.com → app REST; webhook https://<servicio>.onrender.com/webhooks/paypal
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        value: live
      # Correo de contacto para dudas o reembolsos
      - key: SUPPORT_EMAIL
        sync: false

  # Alternative to the GitHub Actions scheduler on a paid plan (Render cron jobs are not free):
  # - type: cron
  #   name: car-checkup-reminders
  #   runtime: node
  #   schedule: "5 * * * *"
  #   buildCommand: npm ci --include=dev && npm run db:generate -w backend
  #   startCommand: npm run job:reminders -w backend
  #   envVars: same as the API (DATABASE_URL, VAPID_*, EMAIL_*, RESEND_*, APP_URL, API_URL, UNSUBSCRIBE_SECRET)
